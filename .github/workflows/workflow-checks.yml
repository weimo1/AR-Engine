name: Workflow checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workflow-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-checks:
    name: workflow-checks
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.14.0'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Restore pinned project tools
        shell: pwsh
        run: ./scripts/setup-workflow.ps1
      - name: Validate documents, workflow tests and SDD
        shell: pwsh
        run: python scripts/workflow.py ci

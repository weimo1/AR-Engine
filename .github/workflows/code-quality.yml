name: Code quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: code-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpp-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install the pinned formatter
        run: |
          python -m pip install --only-binary=:all: --no-deps clang-format==21.1.6
      - name: Check changed C++ code
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/check_cpp_quality.py "${BASE:-HEAD^}"
